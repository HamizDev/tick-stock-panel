services:
  app:
    image: ${TSP_IMAGE:-ghcr.io/hamizdev/tick-stock-panel:latest}
    container_name: tick-stock-panel
    ports:
      - "127.0.0.1:${TSP_HOST_PORT:-3018}:3018"
    env_file:
      - /opt/tick-stock-panel/.env
    environment:
      HOST: 0.0.0.0
      PORT: 3018
      DATA_DIR: /app/data
    volumes:
      - /opt/tick-stock-panel/data:/app/data
      - /opt/tick-stock-panel/.env:/app/.env:ro
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
